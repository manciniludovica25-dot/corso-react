<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <title>Ordini Ristorante - TypeScript Edition</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="container">
        <h2>Ordini Ristorante</h2>

        <!-- TIPO CLIENTE -->
        <div class="card">
            <label for="tipoCliente">Tipo Cliente</label>
            <select id="tipoCliente">
                <option value="persona">Persona</option>
                <option value="azienda">Azienda</option>
            </select>
        </div>

        <!-- FORM PERSONA -->
        <div id="formPersona" class="card">
            <label for="nome">Nome</label>
            <input type="text" id="nome" placeholder="Nome">

            <label for="cognome">Cognome</label>
            <input type="text" id="cognome" placeholder="Cognome">
        </div>

        <!-- FORM AZIENDA -->
        <div id="formAzienda" class="card" style="display:none;">
            <label for="ragioneSociale">Ragione Sociale</label>
            <input type="text" id="ragioneSociale" placeholder="Ragione sociale">

            <label for="tipoAzienda">Tipo Azienda</label>
            <select id="tipoAzienda">
                <option value="SaS">SaS</option>
                <option value="Srl">Srl</option>
                <option value="SpA">SpA</option>
            </select>
        </div>

        <!-- PIATTI -->
        <div class="card">
            <label for="piatti">Piatti</label>
            <select id="piatti" multiple size="5"></select>
        </div>

        <button id="btnInvia">Invia ordine</button>

        <hr>

        <div id="ordini"></div>
    </div>

    <script type="module" src="src/app.js"></script>
</body>

</html>
